[package]
name = "kycom"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.4.0"
log = "0.4.20"
kyproto = { version = "0.1", path = "../kyproto", features = ["tokio-rt"], optional = true }
tokio = { version = "1.32.0", features = ["rt-multi-thread", "io-util", "sync"] }

[features]
default = []
kynet-quinn = ["kyproto/kynet-quinn"]
kynet-wtransport = ["kyproto/kynet-wtransport"]
